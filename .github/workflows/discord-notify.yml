name: Discord notifications
on:
  workflow_run:
    workflows: [build, release]
    types: [completed]
  workflow_dispatch:
    inputs:
      kind:
        description: Verified notice type to test or retry
        required: true
        type: choice
        options: [action, release]
      run_id:
        description: Existing official successful push workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: discord-notify-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.repository == 'johnceoskyblock/sparkling-mutuals' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == 'johnceoskyblock/sparkling-mutuals' &&
      ((github.event.workflow_run.name == 'build' && github.event.workflow_run.head_branch == 'master') ||
      github.event.workflow_run.name == 'release')))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      # No checkout or execution of workflow artifacts, pull-request code or downloaded scripts.
      - name: Request a verified Discord announcement
        env:
          SM_NOTIFICATION_URL: ${{ vars.SM_NOTIFICATION_URL }}
          SM_NOTIFICATION_SECRET: ${{ secrets.SM_NOTIFICATION_SECRET }}
          SM_GITHUB_READ_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, hmac, json, os, re, time, urllib.request, urllib.parse
          repository = "johnceoskyblock/sparkling-mutuals"
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as stream:
              event = json.load(stream)
          if (os.environ.get("GITHUB_REPOSITORY") != repository
              or event.get("repository", {}).get("full_name") != repository):
              raise SystemExit("Notification is restricted to the official repository.")
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              inputs = event.get("inputs", {})
              kind, run_id = inputs.get("kind"), inputs.get("run_id")
              if os.environ.get("GITHUB_REF") != "refs/heads/master":
                  raise SystemExit("Run notification tests from master.")
          elif os.environ.get("GITHUB_EVENT_NAME") == "workflow_run":
              run = event.get("workflow_run", {})
              source, head = run.get("repository", {}), run.get("head_repository", {})
              eligible = (run.get("event") == "push" and run.get("status") == "completed"
                  and run.get("conclusion") == "success" and source.get("full_name") == repository
                  and head.get("full_name") == repository and head.get("id") == source.get("id"))
              if run.get("path") == ".github/workflows/build.yml" and run.get("head_branch") == "master":
                  kind = "action"
              elif (run.get("path") == ".github/workflows/release.yml"
                  and re.fullmatch(r"v\d+\.\d+\.\d+(?:-beta\.\d+)?", str(run.get("head_branch", "")))):
                  kind = "release"
              else:
                  eligible = False
              if not eligible:
                  print("Skipped ineligible workflow.")
                  raise SystemExit(0)
              run_id = str(run.get("id", ""))
          else:
              raise SystemExit("Unsupported notification event.")
          if kind not in ("action", "release") or not re.fullmatch(r"\d{1,20}", str(run_id or "")):
              raise SystemExit("A verified notice kind and numeric run ID are required.")
          destination, secret = os.environ.get("SM_NOTIFICATION_URL", ""), os.environ.get("SM_NOTIFICATION_SECRET", "")
          parsed = urllib.parse.urlsplit(destination)
          if (parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password
              or parsed.query or parsed.fragment or parsed.path != "/notifications"
              or not re.fullmatch(r"[a-f0-9]{64}", secret)):
              raise SystemExit("Configure the HTTPS notification endpoint and signing secret.")
          read_token = os.environ.get("SM_GITHUB_READ_TOKEN", "")
          if not re.fullmatch(r"ghs_[A-Za-z0-9_.-]{20,4092}", read_token):
              raise SystemExit("A temporary GitHub Actions read token is required.")
          body = json.dumps({"repository": repository, "kind": kind, "runId": str(run_id), "githubReadToken": read_token}, separators=(",", ":")).encode()
          stamp = str(int(time.time()))
          signature = hmac.new(secret.encode(), stamp.encode() + b"." + body, hashlib.sha256).hexdigest()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                  return None
          request = urllib.request.Request(destination, data=body, headers={
              "Content-Type": "application/json", "User-Agent": "Sparkling-Mutuals-Notifications", "x-sm-timestamp": stamp,
              "x-sm-signature": "sha256=" + signature}, method="POST")
          try:
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=45) as response:
                  raw = response.read(65537)
              if len(raw) > 65536:
                  raise ValueError("Oversized response")
              result = json.loads(raw)
              if not isinstance(result, dict) or result.get("status") not in ("sent", "duplicate"):
                  raise ValueError("Receipt needs review")
              print("Discord announcement confirmed: " + result["status"] + ".")
          except Exception:
              raise SystemExit("Announcement not confirmed. Review the bot receipt before retrying.")
