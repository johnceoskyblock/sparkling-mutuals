name: build
on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  ship-script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test local shipping automation without GitHub writes
        shell: pwsh
        run: ./scripts/tests/Ship.Tests.ps1
  sync-backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend/cloudflare-sync
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/cloudflare-sync/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
  build-logic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: ./gradlew -p buildSrc test
  windows-updater:
    runs-on: windows-2025
    env:
      JAVA_TOOL_OPTIONS: -Djunit.jupiter.tempdir.cleanup.mode.default=NEVER
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify restart installation with a locked Windows JAR
        run: .\gradlew.bat :26.1.2:test -Pedition=full --tests '*UpdateInstallTest'
  target:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["26.1.2", "26.2", "26.3"]
        edition: [standard, full, full-no-auto-update]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Test, build and verify target
        run: ./gradlew :${{ matrix.minecraft }}:verifyTargetJar -Pedition=${{ matrix.edition }}
      - uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.edition }}-mc${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/${{ matrix.edition != 'full' && format('{0}/', matrix.edition) || '' }}libs/sparkling-mutuals-*+mc${{ matrix.minecraft }}.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-${{ matrix.edition }}-mc${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/${{ matrix.edition != 'full' && format('{0}/', matrix.edition) || '' }}test-results/test/TEST-*.xml
          if-no-files-found: error
  verify-all-targets:
    needs: [build-logic, target]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: jar-*-mc*
          path: incoming
          merge-multiple: true
      - run: chmod +x gradlew
      - run: ./gradlew verifyReleaseMatrix -PdistributionDir=incoming
  build:
    if: always()
    needs: [ship-script, sync-backend, build-logic, windows-updater, target, verify-all-targets]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable build and verification job to pass
        env:
          BUILD_LOGIC_RESULT: ${{ needs.build-logic.result }}
          TARGET_RESULT: ${{ needs.target.result }}
          DISTRIBUTION_RESULT: ${{ needs.verify-all-targets.result }}
          SYNC_BACKEND_RESULT: ${{ needs.sync-backend.result }}
          WINDOWS_UPDATER_RESULT: ${{ needs.windows-updater.result }}
          SHIP_SCRIPT_RESULT: ${{ needs.ship-script.result }}
        run: |
          test "$BUILD_LOGIC_RESULT" = success
          test "$TARGET_RESULT" = success
          test "$DISTRIBUTION_RESULT" = success
          test "$SYNC_BACKEND_RESULT" = success
          test "$SHIP_SCRIPT_RESULT" = success
          test "$WINDOWS_UPDATER_RESULT" = success
