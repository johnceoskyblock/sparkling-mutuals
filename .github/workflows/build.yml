name: build
on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  capture-shot-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Test local replay and visual diagnostics
        run: python -m unittest discover -s tools/capture_shots/tests -p 'test_*.py' -v
      - name: Package allowlisted sources and synthetic fixtures
        run: python tools/capture_shots/package_tools.py --output build/capture-shot-tools
      - name: Verify packaged v1 and v2 collection tools
        working-directory: build/capture-shot-tools
        run: python -m unittest discover -s tools/capture_shots/tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@v7
        with:
          name: capture-shot-tools
          path: build/capture-shot-tools/
          if-no-files-found: error
  build-logic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: ./gradlew -p buildSrc test
  target:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Capture-shot development is intentionally 26.1.2-only until the feature is finished.
        minecraft: ${{ fromJSON((github.ref == 'refs/heads/feature/capture-shot-projection' || github.head_ref == 'feature/capture-shot-projection') && '["26.1.2"]' || '["26.1.2", "26.2", "26.3"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Test, build and verify target
        run: ./gradlew :${{ matrix.minecraft }}:verifyTargetJar
      - uses: actions/upload-artifact@v7
        with:
          name: jar-mc${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/libs/sparkling-mutuals-*+mc${{ matrix.minecraft }}.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-mc${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/test-results/test/TEST-*.xml
          if-no-files-found: error
  verify-all-targets:
    if: github.ref != 'refs/heads/feature/capture-shot-projection' && github.head_ref != 'feature/capture-shot-projection'
    needs: [build-logic, target, capture-shot-tools]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: jar-mc*
          path: incoming
          merge-multiple: true
      - run: chmod +x gradlew
      - run: ./gradlew verifyDistributions -PdistributionDir=incoming
  build:
    if: always()
    needs: [build-logic, target, capture-shot-tools, verify-all-targets]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable build and verification job to pass
        env:
          BUILD_LOGIC_RESULT: ${{ needs.build-logic.result }}
          TARGET_RESULT: ${{ needs.target.result }}
          TOOLS_RESULT: ${{ needs.capture-shot-tools.result }}
          DISTRIBUTION_RESULT: ${{ needs.verify-all-targets.result }}
          CAPTURE_BRANCH: ${{ github.ref == 'refs/heads/feature/capture-shot-projection' || github.head_ref == 'feature/capture-shot-projection' }}
        run: |
          test "$BUILD_LOGIC_RESULT" = success
          test "$TARGET_RESULT" = success
          test "$TOOLS_RESULT" = success
          if [ "$CAPTURE_BRANCH" = true ]; then
            test "$DISTRIBUTION_RESULT" = skipped
          else
            test "$DISTRIBUTION_RESULT" = success
          fi
