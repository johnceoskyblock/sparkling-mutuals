name: release
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend/cloudflare-sync
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/cloudflare-sync/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
  build-logic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: ./gradlew validateReleaseTag
        if: github.event_name == 'push'
      - run: ./gradlew -p buildSrc test
  windows-updater:
    runs-on: windows-2025
    env:
      JAVA_TOOL_OPTIONS: -Djunit.jupiter.tempdir.cleanup.mode.default=NEVER
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify restart installation with a locked Windows JAR
        run: .\gradlew.bat :26.1.2:test -Pedition=full --tests '*UpdateInstallTest'
  target:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1.2', '26.2', '26.3']
        edition: [standard, full, full-no-auto-update]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: ./gradlew :${{ matrix.minecraft }}:verifyTargetJar -Pedition=${{ matrix.edition }}
      - uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.edition }}-mc${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/${{ matrix.edition != 'full' && format('{0}/', matrix.edition) || '' }}libs/sparkling-mutuals-*+mc${{ matrix.minecraft }}.jar
          if-no-files-found: error
  verify:
    needs: [sync-backend, build-logic, windows-updater, target]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: jar-*-mc*
          path: incoming
          merge-multiple: true
      - run: chmod +x gradlew
      - run: ./gradlew verifyReleaseMatrix -PdistributionDir=incoming
      - uses: actions/upload-artifact@v7
        with:
          name: verified-release-assets
          path: build/release-assets/*
          if-no-files-found: error
  publish:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'johnceoskyblock/sparkling-mutuals'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: verified-release-assets
          path: incoming
      - run: chmod +x gradlew
      - run: ./gradlew publishVerifiedRelease -PdistributionDir=incoming
        env:
          GITHUB_TOKEN: ${{ github.token }}
